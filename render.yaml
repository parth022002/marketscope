services:
  # ─── MarketScope.io Backend API (FastAPI) ───
  - type: web
    name: marketscope-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "MarketScope.io API"
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SNAPSHOT_SIGNING_SALT
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: AI_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # ─── MarketScope.io Web Frontend (Next.js 15) ───
  - type: web
    name: marketscope-web
    env: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: "MarketScope.io"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          name: marketscope-api
          type: web
          property: host
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_AI_ENABLED
        value: "true"
