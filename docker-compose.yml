services:
  db:
    image: postgres:16-alpine
    container_name: marketscope-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketscope}
      POSTGRES_USER: ${POSTGRES_USER:-marketscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_change_me}
    ports:
      - "5432:5432"
    volumes:
      - marketscope_pgdata:/var/lib/postgresql/data
      - ./database/schema/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketscope} -d ${POSTGRES_DB:-marketscope}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketscope-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - marketscope_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: marketscope-api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marketscope}:${POSTGRES_PASSWORD:-local_dev_change_me}@db:5432/${POSTGRES_DB:-marketscope}
      REDIS_URL: redis://redis:6379/0
      API_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    container_name: marketscope-web
    environment:
      NEXT_PUBLIC_APP_NAME: MarketScope.io
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  marketscope_pgdata:
  marketscope_redisdata:
